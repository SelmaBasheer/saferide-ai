image:
  repository: saferidedevacr30.azurecr.io/gateway
  tag: v1

env:
  ASPNETCORE_ENVIRONMENT: Development

  # No Azure CLI in the container, so skip Key Vault entirely — otherwise every
  # start waits for a credential that cannot exist.
  KeyVault__Uri: ""

  # Each service is reachable by its Kubernetes Service name, which is the Helm
  # release name. Port 80 is the Service port; the chart maps it to 8080.
  ReverseProxy__Clusters__identity__Destinations__d1__Address: "http://identity-service/"
  ReverseProxy__Clusters__school__Destinations__d1__Address: "http://school-service/"
  ReverseProxy__Clusters__driver__Destinations__d1__Address: "http://driver-service/"
  ReverseProxy__Clusters__student__Destinations__d1__Address: "http://student-service/"
  ReverseProxy__Clusters__bus__Destinations__d1__Address: "http://bus-service/"
  ReverseProxy__Clusters__route__Destinations__d1__Address: "http://route-service/"
  ReverseProxy__Clusters__tracking__Destinations__d1__Address: "http://tracking-service/"
  ReverseProxy__Clusters__ai__Destinations__d1__Address: "http://ai-service/"
  ReverseProxy__Clusters__analytics__Destinations__d1__Address: "http://analytics-service/"

envFromSecrets:
  - gateway-secret