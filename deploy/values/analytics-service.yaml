image:
  repository: saferidedevacr30.azurecr.io/analytics-service
  tag: v1

env:
  ASPNETCORE_ENVIRONMENT: Development
  RabbitMQ__Host: rabbitmq
  Saferide__Timezone: "Asia/Kolkata"

envFromSecrets:
  - analytics-secret

probes:
  # Analytics has no HealthController yet. Disabled rather than pointed at a
  # path that 404s, which makes Kubernetes kill a perfectly healthy pod.
  enabled: false