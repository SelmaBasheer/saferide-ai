name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch name convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Branch: $BRANCH"
          PATTERN='^(feat|fix|chore|refactor|docs|test|perf|ci|build|revert)/[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "::error::Invalid branch name '$BRANCH'"
            echo "Expected: <type>/<kebab-case-description>"
            echo "Allowed types: feat, fix, chore, refactor, docs, test, perf, ci, build, revert"
            echo "Example: feat/bus-service"
            exit 1
          fi
          echo "Branch name OK"

  dotnet:
    name: .NET build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: |
          for sln in $(find . -name "*.slnx"); do
            echo "== building $sln =="
            dotnet build "$sln" --configuration Release
          done

      - name: Test
        run: |
          for sln in $(find . -name "*.slnx"); do
            dotnet test "$sln" --configuration Release --no-build --verbosity minimal
          done

      - name: Check formatting (CSharpier)
        run: dotnet csharpier check .

  java:
    name: Java build & check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: notification, path: server/services/notification-service/notification }
          - { name: student,      path: server/services/student-service/student }
          - { name: bus,          path: server/services/bus-service/bus }
          - { name: route,        path: server/services/route-service/route }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Spotless check
        working-directory: ${{ matrix.service.path }}
        run: ./mvnw -B spotless:check

      # Tests are skipped deliberately. The generated contextLoads test is a
      # @SpringBootTest: it boots the whole context, which connects to Mongo and
      # creates indexes, so it needs live infrastructure and Doppler-injected
      # credentials. Neither exists on a runner. Making it run here means giving
      # each service a Testcontainers-backed database — worth doing, tracked
      # separately, not a one-line change.
      - name: Compile
        working-directory: ${{ matrix.service.path }}
        run: ./mvnw -B -DskipTests compile

  web:
    name: Web build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/admin-web/package-lock.json

      - name: Install
        working-directory: client/admin-web
        run: npm ci

      # npm run build is already "tsc -b && vite build", so this step is the
      # same check run on its own. Kept separate so a red X says which half
      # broke — types or bundling — without opening the log.
      - name: Typecheck
        working-directory: client/admin-web
        run: npx tsc --noEmit

      - name: Build
        working-directory: client/admin-web
        run: npm run build