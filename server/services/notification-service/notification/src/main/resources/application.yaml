spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:saferide}
    password: ${SPRING_RABBITMQ_PASSWORD:password}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

sendgrid:
  api-key: ${SENDGRID_API_KEY:}       # empty default: the trial ended, and an
  from-email: ${SENDGRID_FROM_EMAIL:} # unresolvable placeholder stops startup
  from-name: SafeRide AI              # even when the bean is not created

email:
  provider: ${EMAIL_PROVIDER:sendgrid}

brevo:
  api-key: ${BREVO_API_KEY:}
  from-email: ${BREVO_FROM_EMAIL:}
  from-name: SafeRide AI

whatsapp:
  provider: ${WHATSAPP_PROVIDER:twilio}
  enabled: ${WHATSAPP_ENABLED:true}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from: ${TWILIO_WHATSAPP_FROM:}
  meta:
    api-version: ${WHATSAPP_API_VERSION:v23.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}

saferide:
  rabbitmq:
    identity-exchange: identity.events
    otp-queue: notification.otp-email
    otp-routing-key: otp-email-requested
    school-exchange: school.events
    school-submitted-queue: notification.school-submitted
    school-approved-queue: notification.school-approved
    school-rejected-queue: notification.school-rejected
    subscription-expiring-queue: notification.subscription-expiring
    ai-exchange: ai.events
    alert-approved-queue: notification.alert-approved
  notification:
    superadmin-email: ${SUPERADMIN_EMAIL}
    alert-whatsapp-to: ${ALERT_WHATSAPP_TO:}
  app:
    base-url: ${APP_BASE_URL:http://localhost:5173}
