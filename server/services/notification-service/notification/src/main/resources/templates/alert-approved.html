<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
</head>
<body style="margin:0;padding:24px;background:#f8fafc;font-family:Segoe UI,system-ui,sans-serif;color:#1e293b">

<div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:28px">

    <p style="margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#64748b">
        SafeRide AI
    </p>

    <h1 style="margin:0 0 16px;font-size:20px;font-weight:600;color:#0f172a">
        <span th:text="${anomalyType}">Route deviation</span>
        on <span th:text="${routeCode}">R-03</span>
    </h1>

    <p style="margin:0 0 20px;font-size:14px;color:#475569">
        Route <strong th:text="${routeName}">Kollam Town Morning Loop</strong>
    </p>

    <div style="border-left:3px solid #0369a1;background:#f1f5f9;padding:14px 16px;margin:0 0 24px">
        <p style="margin:0;font-size:15px;line-height:1.6" th:text="${message}">
            The bus left three stops unvisited near the end of the route.
        </p>
    </div>

    <p style="margin:0;font-size:13px;color:#64748b;line-height:1.6">
        This alert was reviewed and approved by a member of your school's staff
        before it was sent. Please check with the driver.
    </p>

</div>

<p style="max-width:560px;margin:16px auto 0;font-size:12px;color:#94a3b8;text-align:center">
    Sent automatically by SafeRide AI.
</p>

</body>
</html>
