<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
<div style="max-width:560px;margin:24px auto;background:#ffffff;border-radius:8px;padding:32px;">
    <h2 style="color:#1a56db;margin-top:0;">SafeRide AI</h2>
    <h3 style="margin-bottom:8px;color:#057a55;">Your school has been approved 🎉</h3>
    <p>Great news — <strong th:text="${schoolName}">School name</strong> has been verified
        and approved on SafeRide.</p>
    <p>You now have full access: add parents and drivers, register your buses,
        and start real-time tracking.</p>
    <p style="color:#999;font-size:12px;margin-top:32px;">SafeRide AI — school bus tracking platform</p>
</div>
</body>
</html>
