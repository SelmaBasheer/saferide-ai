server {
    # 8080 to match every other service, so the Helm chart needs no override.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URLs. Without this, refreshing on /dashboard asks
    # nginx for a file called "dashboard", which does not exist, and returns
    # 404. try_files falls back to index.html and lets the router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}