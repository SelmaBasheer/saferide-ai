name: saferide

x-common: &common
  restart: unless-stopped
  networks: [saferide-net]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  gateway:
    <<: *common
    build: ./server/services/gateway-service/SafeRide.Gateway
    image: saferide/gateway:local
    container_name: saferide-gateway
    ports:
      - "5000:8080"
    environment:
      JwtSettings__Secret: ${JWT_SECRET}
      # No Azure CLI inside the container, so skip Key Vault entirely here —
      # otherwise every start waits ~10s for a credential that cannot exist.
      # On the host, dotnet run still reads Key Vault via az login.
      KeyVault__Uri: ""
      ReverseProxy__Clusters__identity__Destinations__d1__Address: http://identity-service:8080/
      ReverseProxy__Clusters__school__Destinations__d1__Address: http://school-service:8080/
      ReverseProxy__Clusters__driver__Destinations__d1__Address: http://driver-service:8080/
      ReverseProxy__Clusters__student__Destinations__d1__Address: http://student-service:8080/
      ReverseProxy__Clusters__bus__Destinations__d1__Address: http://bus-service:8080/
      ReverseProxy__Clusters__route__Destinations__d1__Address: http://route-service:8080/
      ReverseProxy__Clusters__tracking__Destinations__d1__Address: http://tracking-service:8080/
      ReverseProxy__Clusters__ai__Destinations__d1__Address: http://ai-service:8080/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - identity-service
      - school-service
      - bus-service
      - ai-service

  postgres:
    <<: *common
    image: postgres:17-alpine
    container_name: saferide-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  sqlserver:
    <<: *common
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saferide-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${MSSQL_SA_PASSWORD} -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  mysql:
    <<: *common
    image: mysql:8.4
    container_name: saferide-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-saferide_student}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongodb:
    <<: *common
    image: mongo:8
    container_name: saferide-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    <<: *common
    image: rabbitmq:4-management-alpine
    container_name: saferide-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  identity-service:
    <<: *common
    build:
      context: .
      dockerfile: server/services/identity-service/SafeRide.Identity/Dockerfile
    image: saferide/identity-service:local
    container_name: saferide-identity
    ports:
      - "${IDENTITY_PORT:-5001}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      JwtSettings__AccessTokenMinutes: "15"
      JwtSettings__RefreshTokenDays: "7"
      Seed__SuperAdminEmail: ${SUPERADMIN_EMAIL}
      Seed__SuperAdminPhone: ${SUPERADMIN_PHONE}
      Seed__SuperAdminPassword: ${SUPERADMIN_PASSWORD}
    volumes:
      - identity-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  school-service:
    <<: *common
    build:
      context: .
      dockerfile: server/services/school-service/SafeRide.School/Dockerfile
    image: saferide/school-service:local
    container_name: saferide-school
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SafeRide_School_Db;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      AzureStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"    
    
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_healthy

  notification-service:
    <<: *common
    build:
      context: server/services/notification-service/notification
      dockerfile: Dockerfile
    image: saferide/notification-service:local
    container_name: saferide-notification
    ports:
      - "${NOTIFICATION_PORT:-5005}:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      ALERT_WHATSAPP_TO: ${ALERT_WHATSAPP_TO}
    depends_on:
      rabbitmq:
        condition: service_healthy

  bus-service:
    <<: *common
    build:
      context: server/services/bus-service/bus
      dockerfile: Dockerfile
    image: saferide/bus-service:local
    container_name: saferide-bus
    ports:
      - "5011:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/saferide_bus?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://host.docker.internal:10000/devstoreaccount1;"
      AZURE_STORAGE_PUBLIC_ENDPOINT: "http://localhost:10000/devstoreaccount1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_healthy

  route-service:
    <<: *common
    build:
      context: server/services/route-service/route
      dockerfile: Dockerfile
    image: saferide/route-service:local
    container_name: saferide-route
    ports:
      - "5013:8080"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      ROUTING_BASE_URL: ${ROUTING_BASE_URL:-https://router.project-osrm.org}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  student-service:
    <<: *common
    build:
      context: server/services/student-service/student
      dockerfile: Dockerfile
    image: saferide/student-service:local
    container_name: saferide-student
    ports:
      - "5009:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/saferide_student?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  driver-service:
    <<: *common
    build:
      context: .
      dockerfile: server/services/driver-service/Dockerfile
    image: saferide/driver-service:local
    container_name: saferide-driver
    ports:
      - "5007:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DriverDb: "Host=postgres;Port=5432;Database=saferide_driver;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  tracking-service:
    <<: *common
    build:
      context: .
      dockerfile: server/services/tracking-service/Dockerfile
    image: saferide/tracking-service:local
    container_name: saferide-tracking
    ports:
      - "5015:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__Host: mongodb
      Mongo__Port: "27017"
      Mongo__Username: ${MONGO_ROOT_USERNAME}
      Mongo__Password: ${MONGO_ROOT_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      # Trip start is the only time Tracking calls out. Inside the network these
      # are container names, not host ports.
      Services__Route: "http://route-service:8080"
      Services__Student: "http://student-service:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-service:
    <<: *common
    build:
      context: .
      dockerfile: server/services/ai-service/SafeRide.Ai/Dockerfile
    image: saferide/ai-service:local
    container_name: saferide-ai
    ports:
      - "5017:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AiDb: "Server=sqlserver,1433;Database=SafeRide_Ai_Db;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      Gemini__ApiKey: ${GEMINI__APIKEY}
      Gemini__Model: "gemini-3.6-flash"
      Gemini__MaxTokens: "2048"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  azurite:
    <<: *common
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: saferide-azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:10000/devstoreaccount1?comp=list', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  saferide-net:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  identity-logs:
  sqlserver-data:
  azurite-data:
  mysql-data:
  mongodb_data: